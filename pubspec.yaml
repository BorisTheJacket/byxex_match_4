name: byxex_match
description: Byxex Match Cyber Club — official app for the Betmatch cyber club network.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.6.3
  onesignal_flutter: ^5.0.4

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.3

  # Fonts & Icons
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # State / Utils
  shared_preferences: ^2.3.3
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: BlackHanSans
      fonts:
        - asset: assets/fonts/BlackHanSans-Regular.ttf
